name: Nightly Stress

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_ENV: test
      NEXT_PUBLIC_APP_ENV: test
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.TEST_SESSION_SECRET }}
      ENABLE_E2E_SESSION_BOOTSTRAP: "false"
      ENABLE_TEST_AUTH_HELPER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:stress
